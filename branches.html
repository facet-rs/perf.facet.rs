  <style>
@font-face {
  font-family: 'Iosevka FTL';
  src: url('fonts/IosevkaFtl-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Iosevka FTL';
  src: url('fonts/IosevkaFtl-Bold.ttf') format('truetype');
  font-weight: 600 700;
  font-style: normal;
  font-display: swap;
}

:root {
  color-scheme: light dark;

  --mono: 'Iosevka FTL', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

  /* Surfaces */
  --bg:     light-dark(#fbfbfc, #0b0e14);
  --panel:  light-dark(#ffffff, #0f1420);
  --panel2: light-dark(#f6f7f9, #0c111b);

  /* Text */
  --text:  light-dark(#0e1116, #e7eaf0);
  --muted: light-dark(#3a4556, #a3adbd);

  /* Borders */
  --border:  light-dark(rgba(0,0,0,0.1), rgba(255,255,255,0.1));

  /* Semantic */
  --accent: light-dark(#2457f5, #7aa2f7);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  max-width: 1400px;
  margin: 0 auto;
  padding: 2em 1em;
  font-size: 14px;
  line-height: 1.6;
}

h1, h2 {
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.5em;
  font-weight: 650;
  letter-spacing: -0.01em;
  margin-bottom: 0.8em;
}

h1 { font-size: 24px; }
h2 { font-size: 18px; margin-top: 2em; }

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

th, td {
  text-align: left;
  padding: 0.75em;
  border-bottom: 1px solid var(--border);
}

th {
  background: var(--panel2);
  font-weight: 600;
  font-size: 13px;
}

tr:last-child td {
  border-bottom: none;
}

a {
  color: var(--accent);
  text-decoration: none;
  transition: opacity 0.15s;
}

a:hover {
  opacity: 0.8;
}

code {
  background: var(--panel2);
  color: var(--text);
  padding: 0.2em 0.4em;
  border-radius: 3px;
  font-size: 13px;
  font-family: var(--mono);
}

.branch-section {
  background: var(--panel);
  margin: 1em 0;
  padding: 1em;
  border-radius: 8px;
  border: 1px solid var(--border);
}
